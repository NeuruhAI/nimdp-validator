[project]
name = "nimdp-validator"
version = "0.1.0"
description = "NIMDP Protocol Checker Agent"
dependencies = [
    "requests",
    "PyYAML",
    "pydantic",
    "rich",
]

[tool.setuptools.packages.find]
include = ["nimdp_validator*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."
